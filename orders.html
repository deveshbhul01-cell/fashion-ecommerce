<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders | StyleHub</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f6;color:#111;font-family:Arial,sans-serif}
.orders-header{background:#fff;border-bottom:1px solid #eee;padding:18px 5%;position:sticky;top:0;z-index:100}
.orders-nav{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{text-decoration:none;color:#111;font-size:25px;font-weight:900;letter-spacing:-1px}.logo span{color:#777}.back-link{text-decoration:none;color:#555;font-size:14px}
.orders-page{max-width:1000px;margin:auto;padding:45px 20px}.page-heading{margin-bottom:30px}.page-heading h1{font-size:36px;margin:0 0 8px}.page-heading p{color:#777;margin:0}
.order-card,.empty-orders{background:#fff;border:1px solid #e7e7e7;border-radius:18px;margin-bottom:20px;overflow:hidden}
.order-top,.order-bottom{display:flex;justify-content:space-between;align-items:center;padding:20px 22px}.order-top{gap:15px;border-bottom:1px solid #eee}.order-number{font-size:17px;font-weight:800}.order-date{color:#777;font-size:13px;margin-top:5px}
.status{padding:8px 13px;border-radius:30px;font-size:12px;font-weight:800;text-transform:uppercase;background:#eee}.status.pending{background:#fff3cd;color:#856404}.status.confirmed{background:#dbeafe;color:#1e40af}.status.shipped{background:#e0e7ff;color:#3730a3}.status.delivered{background:#dcfce7;color:#166534}.status.cancelled{background:#fee2e2;color:#991b1b}
.order-body{padding:20px 22px}.section-title{font-size:14px;font-weight:800;margin-bottom:12px}.order-item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #f0f0f0}.item-info{display:flex;gap:12px;align-items:center}.item-icon{width:42px;height:42px;border-radius:10px;background:#f2f2f2;display:flex;align-items:center;justify-content:center;font-size:20px}.item-name,.item-price{font-weight:700;font-size:14px}.item-quantity{color:#777;font-size:13px;margin-top:3px}
.order-bottom{background:#fafafa;border-top:1px solid #eee}.total-label{color:#666;font-size:14px}.total-price{font-size:21px;font-weight:900}
.empty-orders{padding:70px 25px;text-align:center}.empty-icon{font-size:55px;margin-bottom:15px}.empty-orders h2{margin:0 0 8px}.empty-orders p,.loading,.error-box p{color:#777}.shop-button{display:inline-block;margin-top:20px;padding:14px 24px;background:#111;color:#fff;text-decoration:none;border-radius:9px;font-weight:800}
.loading{text-align:center;padding:70px}.spinner{width:35px;height:35px;border:3px solid #ddd;border-top-color:#111;border-radius:50%;margin:0 auto 15px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#fff;border-radius:18px;padding:40px 20px;text-align:center}.retry-button{border:0;background:#111;color:#fff;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold}
@media(max-width:600px){.orders-page{padding:30px 15px}.page-heading h1{font-size:29px}.order-top{align-items:flex-start;flex-direction:column;padding:17px}.order-body,.order-bottom{padding:16px}}
</style>
</head>
<body>
<header class="orders-header"><nav class="orders-nav"><a href="index.html" class="logo">STYLE<span>HUB</span></a><a href="index.html" class="back-link">← Continue Shopping</a></nav></header>
<main class="orders-page">
<div class="page-heading"><h1>My Orders</h1><p>Track and view your StyleHub purchases.</p></div>
<div id="loading" class="loading"><div class="spinner"></div>Loading your orders...</div>
<div id="orders-list" style="display:none;"></div>
<div id="empty-orders" class="empty-orders" style="display:none;"><div class="empty-icon">🛍️</div><h2>No Orders Yet</h2><p>You haven't placed any orders yet.</p><a href="index.html" class="shop-button">START SHOPPING</a></div>
<div id="error-box" class="error-box" style="display:none;"><h2>Unable to Load Orders</h2><p id="error-message">Something went wrong.</p><button class="retry-button" onclick="loadOrders()">TRY AGAIN</button></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
async function loadOrders(){
const loading=document.getElementById("loading"),list=document.getElementById("orders-list"),empty=document.getElementById("empty-orders"),errorBox=document.getElementById("error-box"),errorMessage=document.getElementById("error-message");
loading.style.display="block";list.style.display=empty.style.display=errorBox.style.display="none";
try{
const {data:{user},error:userError}=await supabaseClient.auth.getUser();
if(userError)throw userError;if(!user){location.href="login.html";return}
const {data:orders,error}=await supabaseClient.from("orders").select(`id,total,status,created_at,order_items(quantity,price)`).eq("user_id",user.id).order("created_at",{ascending:false});
if(error)throw error;loading.style.display="none";
if(!orders?.length){empty.style.display="block";return}
list.innerHTML=orders.map(order=>{
const date=new Date(order.created_at).toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}),status=(order.status||"pending").toLowerCase();
const items=order.order_items?.length?order.order_items.map(item=>{const quantity=Number(item.quantity)||1,price=Number(item.price)||0;return `<div class="order-item"><div class="item-info"><div class="item-icon">🛍️</div><div><div class="item-name">Product</div><div class="item-quantity">Quantity: ${quantity}</div></div></div><div class="item-price">₹${(price*quantity).toLocaleString("en-IN")}</div></div>`}).join(""):`<div class="order-item"><div class="item-info"><div class="item-icon">📦</div><div><div class="item-name">Order items</div><div class="item-quantity">Details unavailable</div></div></div></div>`;
return `<article class="order-card"><div class="order-top"><div><div class="order-number">Order #${order.id}</div><div class="order-date">${date}</div></div><span class="status ${status}">${status}</span></div><div class="order-body"><div class="section-title">ITEMS</div>${items}</div><div class="order-bottom"><span class="total-label">Order Total</span><span class="total-price">₹${Number(order.total||0).toLocaleString("en-IN")}</span></div></article>`;
}).join("");list.style.display="block";
}catch(err){console.error("Orders error:",err);loading.style.display="none";errorBox.style.display="block";errorMessage.textContent=err.message||"Unable to fetch orders."}
}
loadOrders();
</script>
</body>
</html>
