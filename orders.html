<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | StyleHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f6f6f6; color: #111; font-family: Arial, sans-serif; }
        .orders-header { background: #fff; border-bottom: 1px solid #eee; padding: 18px 5%; }
        .orders-nav { max-width: 1200px; margin: auto; display: flex; justify-content: center; }
        .logo { text-decoration: none; color: #111; font-size: 25px; font-weight: 900; }
        .logo span { color: #777; }
        .orders-page { max-width: 1000px; margin: auto; padding: 45px 20px; }
        .page-heading { margin-bottom: 30px; }
        .page-heading h1 { margin: 0 0 8px; font-size: 38px; }
        .page-heading p, .order-date, .item-quantity, .total-label, .empty p, .error p { color: #777; }
        .page-heading p { margin: 0; }
        .order-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 18px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,.04); }
        .order-top, .order-bottom { display: flex; justify-content: space-between; align-items: center; }
        .order-top { padding: 20px 22px; border-bottom: 1px solid #eee; }
        .order-number { font-size: 17px; font-weight: 800; }
        .order-date, .item-quantity, .total-label { font-size: 13px; }
        .order-date { margin-top: 5px; }
        .status { padding: 8px 14px; border-radius: 30px; font-size: 12px; font-weight: 800; text-transform: uppercase; background: #eee; }
        .status.pending { background: #fff3cd; color: #856404; }
        .status.confirmed { background: #dbeafe; color: #1e40af; }
        .status.shipped { background: #e0e7ff; color: #3730a3; }
        .status.delivered { background: #dcfce7; color: #166534; }
        .status.cancelled { background: #fee2e2; color: #991b1b; }
        .order-body { padding: 20px 22px; }
        .items-title { font-size: 13px; font-weight: 800; margin-bottom: 12px; letter-spacing: .5px; }
        .order-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #f0f0f0; }
        .order-item:last-child { border-bottom: 0; }
        .item-left { display: flex; align-items: center; gap: 12px; }
        .item-icon { width: 45px; height: 45px; border-radius: 10px; background: #f2f2f2; display: grid; place-items: center; font-size: 20px; }
        .item-name, .item-price { font-weight: 700; }
        .item-name { font-size: 14px; }
        .item-quantity { margin-top: 4px; }
        .order-bottom { background: #fafafa; padding: 18px 22px; }
        .total-label { font-size: 14px; }
        .total-price { font-size: 21px; font-weight: 900; }
        .loading { text-align: center; padding: 70px 20px; color: #777; }
        .spinner { width: 38px; height: 38px; border: 3px solid #ddd; border-top-color: #111; border-radius: 50%; margin: 0 auto 15px; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty, .error { background: #fff; border-radius: 18px; text-align: center; border: 1px solid #eee; }
        .empty { padding: 70px 25px; }
        .empty-icon { font-size: 55px; margin-bottom: 15px; }
        .empty h2, .error h2 { margin-top: 0; }
        .shop-button, .retry-button { display: inline-block; margin-top: 20px; padding: 13px 22px; border-radius: 9px; background: #111; color: #fff; text-decoration: none; font-weight: 800; border: 0; cursor: pointer; }
        .error { padding: 40px 20px; }
        .error p { word-break: break-word; }
        @media (max-width: 600px) {
            .orders-page { padding: 30px 15px; }
            .page-heading h1 { font-size: 30px; }
            .order-top { flex-direction: column; align-items: flex-start; gap: 15px; }
            .order-body, .order-bottom { padding: 17px; }
        }
    </style>
</head>
<body>
<header class="orders-header">
    <nav class="orders-nav">
        <a href="index.html" class="logo">STYLE<span>HUB</span></a>
    </nav>
</header>

<main class="orders-page">
    <div class="page-heading">
        <h1>My Orders</h1>
        <p>View and track all your StyleHub orders.</p>
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        Loading your orders...
    </div>

    <div id="orders-list" style="display:none;"></div>

    <div id="empty-orders" class="empty" style="display:none;">
        <div class="empty-icon">🛍️</div>
        <h2>No Orders Yet</h2>
        <p>You haven't placed any orders yet.</p>
    </div>

    <div id="error-box" class="error" style="display:none;">
        <h2>Unable to Load Orders</h2>
        <p id="error-message">Something went wrong.</p>
        <button class="retry-button" onclick="loadOrders()">TRY AGAIN</button>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
async function loadOrders() {
    const loading = document.getElementById("loading");
    const ordersList = document.getElementById("orders-list");
    const emptyOrders = document.getElementById("empty-orders");
    const errorBox = document.getElementById("error-box");
    const errorMessage = document.getElementById("error-message");

    loading.style.display = "block";
    ordersList.style.display = emptyOrders.style.display = errorBox.style.display = "none";

    try {
        const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
        if (userError) throw userError;
        if (!user) return window.location.href = "login.html";

        const { data: orders, error } = await supabaseClient
            .from("orders")
            .select(`id,total,status,created_at,order_items(quantity,price)`)
            .eq("user_id", user.id)
            .order("created_at", { ascending: false });

        if (error) throw error;
        loading.style.display = "none";

        if (!orders?.length) return emptyOrders.style.display = "block";

        ordersList.innerHTML = orders.map(order => {
            const date = new Date(order.created_at).toLocaleString("en-IN", {
                day: "2-digit", month: "short", year: "numeric",
                hour: "2-digit", minute: "2-digit"
            });
            const status = String(order.status || "pending").toLowerCase();
            const items = order.order_items?.length
                ? order.order_items.map(item => {
                    const quantity = Number(item.quantity) || 1;
                    const total = (Number(item.price) || 0) * quantity;
                    return `<div class="order-item">
                        <div class="item-left">
                            <div class="item-icon">🛍️</div>
                            <div><div class="item-name">StyleHub Product</div>
                            <div class="item-quantity">Quantity: ${quantity}</div></div>
                        </div>
                        <div class="item-price">₹${total.toLocaleString("en-IN")}</div>
                    </div>`;
                }).join("")
                : `<div class="order-item"><div class="item-left">
                    <div class="item-icon">📦</div>
                    <div><div class="item-name">Order item</div>
                    <div class="item-quantity">Item information unavailable</div></div>
                </div></div>`;

            return `<article class="order-card">
                <div class="order-top">
                    <div><div class="order-number">Order #${order.id}</div>
                    <div class="order-date">${date}</div></div>
                    <span class="status ${status}">${status}</span>
                </div>
                <div class="order-body"><div class="items-title">ORDER ITEMS</div>${items}</div>
                <div class="order-bottom">
                    <span class="total-label">Order Total</span>
                    <span class="total-price">₹${Number(order.total || 0).toLocaleString("en-IN")}</span>
                </div>
            </article>`;
        }).join("");

        ordersList.style.display = "block";
    } catch (error) {
        console.error("Customer orders error:", error);
        loading.style.display = "none";
        errorBox.style.display = "block";
        errorMessage.textContent = error.message || "Unable to fetch your orders.";
    }
}

loadOrders();
</script>
</body>
</html>
