<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StyleHub - Fashion Store</title>

    <link rel="stylesheet" href="style.css">
    
    <script src="script.js"></script>
    
</head>

<body>

    <!-- Header -->
    <header>
        <h1>STYLEHUB</h1>
        <p>Fashion that defines you.</p>
    </header>


    <!-- Hero Section -->
    <section class="hero">

        <h2>New Collection 2026</h2>

        <p>Discover the latest fashion trends.</p>

        <button>Shop Now</button>

    </section>


    <!-- Products -->
    <section class="products">

        <h2>Trending Products</h2>

        <div class="product-container">

            <div class="product">
                <div class="product-image">
    <img src="images/tshirt.jpg" alt="Oversized T-Shirt">
                </div>
                <h3>Oversized T-Shirt</h3>
                <p>₹799</p>
      <button onclick="addToCart('Oversized T-Shirt', 799)">
    Add to Cart
</button>
            </div>


            <div class="product">
                <div class="product-image">
    <img src="images/jeans.jpg" alt="Baggy Jeans">
                </div>
                <h3>Baggy Jeans</h3>
                <p>₹1,499</p>
                <button onclick="addToCart('Baggy Jeans', 1499)">
    Add to Cart
</button>
            </div>


            <div class="product">
                <div class="product-image">
    <img src="images/jacket.jpg" alt="Denim Jacket">
                </div>
                <h3>Denim Jacket</h3>
                <p>₹1,999</p>
                <button onclick="addToCart('Denim Jacket', 1999)">
    Add to Cart
                </button>
            </div>

        </div>

    </section>

<section class="cart">

    <h2>🛒 Your Cart</h2>

    <div id="cart-items">
        <p>Your cart is empty.</p>
    </div>

    <h3>Total: ₹<span id="cart-total">0</span></h3>

</section>

    
    <!-- Footer -->
    <footer>

        <h2>STYLEHUB</h2>

        <p>© 2026 StyleHub</p>

    </footer>

</body>

</html>
